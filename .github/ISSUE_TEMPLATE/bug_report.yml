name: Bug report
description: Сообщить о проблеме OneBar
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте чужие контакты, номера, поисковые запросы или логи с персональными данными.
  - type: input
    id: version
    attributes:
      label: Версия OneBar
      placeholder: 0.15.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: Redmi Note 8T, Android 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Область
      options:
        - Поиск приложений
        - Поиск контактов
        - История и избранное
        - Веб-подсказки
        - Настройки и клавиатура
        - Виджет
        - Установка или обновление
        - Другое
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      description: Что нужно сделать, чтобы проблема появилась?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Логи или скриншот
      description: Удалите персональные данные перед публикацией.
      render: shell
