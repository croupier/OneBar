name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.15.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/onebar-release.jks"
          test -s "$RUNNER_TEMP/onebar-release.jks"

      - name: Unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          ANDROID_STORE_FILE: ${{ runner.temp }}/onebar-release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_APP_METRICA_API_KEY: ${{ secrets.APP_METRICA_API_KEY }}
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Verify and package APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          APK_SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APK_SIGNER"
          "$APK_SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > SIGNING-CERTIFICATE.txt
          cp app/build/outputs/apk/release/app-release.apk "OneBar-$VERSION.apk"
          sha256sum "OneBar-$VERSION.apk" > SHA256SUMS
          test -s "OneBar-$VERSION.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: OneBar ${{ env.VERSION }}
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            OneBar-*.apk
            SHA256SUMS
            SIGNING-CERTIFICATE.txt
          fail_on_unmatched_files: true
          body: |
            Бесплатный некоммерческий Android-проект под MIT.

            - Скачайте `OneBar-*.apk`.
            - Сверьте SHA-256 с `SHA256SUMS`.
            - Сертификат подписи указан в `SIGNING-CERTIFICATE.txt`.
            - Инструкция: https://oneba.ru/install.html
            - Приватность: https://oneba.ru/privacy.html
